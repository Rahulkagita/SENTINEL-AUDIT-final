spring.application.name=SentinelAudit

# ============================================================
# DATABASE CONFIGURATION (PostgreSQL)
# Override via environment variables - see README-ENVIRONMENT.md
# ============================================================
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/sentinelaudit}
spring.datasource.username=${DATABASE_USERNAME:postgres}
# No default password — DATABASE_PASSWORD must be set in the environment
# (see README-ENVIRONMENT.md). An empty default fails fast on connect
# instead of silently falling back to a hardcoded credential.
spring.datasource.password=${DATABASE_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA Configuration
# 'update' only ADDS columns/tables; never drops or truncates data.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Server
server.port=${PORT:8080}

# ============================================================
# CORS
# Only the origins listed here may call the API from a browser.
# Override with a comma-separated CORS_ALLOWED_ORIGINS in production.
# ============================================================
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,https://sentinelauditfrontend.vercel.app}

# ============================================================
# JWT CONFIGURATION
# JWT_SECRET is REQUIRED. It must be a Base64-encoded string that
# decodes to at least 32 bytes (256-bit HMAC-SHA key).
# The application FAILS FAST on startup if it is missing/invalid.
# ============================================================
jwt.secret=${JWT_SECRET:}
jwt.expiration=${JWT_EXPIRATION:86400000}

# ============================================================
# SENTINEL AUDIT ASSISTANT (read-only RAG assistant)
# See README-ENVIRONMENT.md for setup. API keys are read from the
# environment and default to empty (assistant reports "not configured").
# Blank provider = auto: "gemini" when GEMINI_API_KEY is set, else
# OpenAI-compatible HTTP. Chat model: ASSISTANT_LLM_MODEL, else
# GEMINI_MODEL, else the provider default.
# ============================================================

# --- Chat / LLM provider ("openai" | "gemini" | blank = auto) ---
assistant.llm.provider=${ASSISTANT_LLM_PROVIDER:}
assistant.llm.base-url=${ASSISTANT_LLM_BASE_URL:}
assistant.llm.api-key=${ASSISTANT_LLM_API_KEY:}
assistant.llm.model=${ASSISTANT_LLM_MODEL:}
assistant.llm.timeout-seconds=${ASSISTANT_LLM_TIMEOUT_SECONDS:30}
assistant.llm.max-output-tokens=${ASSISTANT_LLM_MAX_OUTPUT_TOKENS:900}
assistant.llm.temperature=${ASSISTANT_LLM_TEMPERATURE:0.2}

# --- Embeddings ("openai" | "gemini" | "local" | blank = follow chat provider) ---
# "local" = deterministic lexical (non-semantic; dev/tests only).
# A GEMINI_API_KEY automatically gets Gemini embeddings too - it is never
# sent to OpenAI's embedding endpoint.
assistant.embedding.provider=${ASSISTANT_EMBEDDING_PROVIDER:}
assistant.embedding.base-url=${ASSISTANT_EMBEDDING_BASE_URL:}
assistant.embedding.api-key=${ASSISTANT_EMBEDDING_API_KEY:}
assistant.embedding.model=${ASSISTANT_EMBEDDING_MODEL:}
assistant.embedding.dimensions=${ASSISTANT_EMBEDDING_DIMENSIONS:0}
assistant.embedding.timeout-seconds=${ASSISTANT_EMBEDDING_TIMEOUT_SECONDS:30}

# --- Retrieval ---
assistant.retrieval.top-k=${ASSISTANT_RETRIEVAL_TOP_K:6}
assistant.retrieval.min-score=${ASSISTANT_RETRIEVAL_MIN_SCORE:0.12}
assistant.retrieval.max-chunks=${ASSISTANT_RETRIEVAL_MAX_CHUNKS:5000}

# --- Chat bounds ---
assistant.chat.max-message-chars=${ASSISTANT_CHAT_MAX_MESSAGE_CHARS:4000}
assistant.chat.max-history-messages=${ASSISTANT_CHAT_MAX_HISTORY_MESSAGES:12}
assistant.chat.max-history-chars=${ASSISTANT_CHAT_MAX_HISTORY_CHARS:8000}
assistant.chat.max-tool-iterations=${ASSISTANT_CHAT_MAX_TOOL_ITERATIONS:3}
assistant.chat.max-tool-result-chars=${ASSISTANT_CHAT_MAX_TOOL_RESULT_CHARS:6000}

# --- Indexing ---
# Off by default: the app has no admin role, so enabling the reindex API is a
# deliberate decision (it stays JWT-protected either way).
assistant.indexing.allow-api=${ASSISTANT_INDEXING_ALLOW_API:false}
assistant.indexing.on-startup=${ASSISTANT_INDEX_ON_STARTUP:false}
assistant.indexing.workspace=${ASSISTANT_KNOWLEDGE_ROOT:}
assistant.indexing.documents=${ASSISTANT_KNOWLEDGE_DOCS:PROTOTYPE_AUDIT.md,README-ENVIRONMENT.md}
assistant.indexing.max-chunk-chars=${ASSISTANT_INDEX_MAX_CHUNK_CHARS:1000}
assistant.indexing.chunk-overlap-chars=${ASSISTANT_INDEX_CHUNK_OVERLAP_CHARS:150}

# H2 in-memory DB for isolated tests (no external PostgreSQL needed).
spring.datasource.url=jdbc:h2:mem:sentinelaudit_test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# Keep JWT valid in tests (must be Base64, decodes to >= 32 bytes).
jwt.secret=dGVzdC1zZWNyZXQtdGhhdC1pcy1hdC1sZWFzdC0zMi1ieXRlcy1sb25nLW5vdy1tZWFuLWl0
jwt.expiration=3600000

# Optional: harmless for tests
server.port=0

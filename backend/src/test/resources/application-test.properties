# ============================================================
# TEST profile configuration (src/test/resources)
#
# Active only when a test declares @ActiveProfiles("test").
# Tests run against an in-memory H2 database so they can never
# touch the PostgreSQL data used by the running application
# (application.properties in src/main/resources keeps pointing
# at PostgreSQL for bootRun/tests-without-this-profile).
#
# This is a test-only JWT signing key for issuing and validating
# tokens inside the test JVM. It is not a production credential.
# ============================================================

spring.datasource.url=jdbc:h2:mem:sentinelaudit-test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# Create the schema from the JPA entities and drop it when the JVM exits.
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

server.port=0

jwt.secret=U2VudGluZWxBdWRpdC1URVNULU9OTFktc2VjcmV0LWRvLW5vdC11c2UtaW4tcHJvZHVjdGlvbi0wMDAwMDA=
jwt.expiration=86400000

# ============================================================
# ASSISTANT PROVIDER ISOLATION (test-only)
#
# Provider selection is environment-first: AssistantConfig resolves a blank
# provider to Gemini whenever a GEMINI_API_KEY exists in the JVM environment
# (see AssistantConfig.resolveLlmProvider). Without pinning these here, a
# developer machine that exports GEMINI_API_KEY / GEMINI_MODEL made the
# "unconfigured assistant" tests depend on ambient state — the status endpoint
# reported configured=true and chat raised a provider error instead of the
# honest "not configured" 503.
#
# These properties are part of the main configuration and therefore outrank the
# OS environment under Spring's precedence rules, so the assistant is
# deterministically UNCONFIGURED (no keys) regardless of the host environment.
# No credential is hardcoded here.
# ============================================================
assistant.llm.provider=openai
assistant.llm.api-key=
assistant.embedding.provider=local
assistant.embedding.api-key=
